name: PlantUML Diagrams

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          wget https://sourceforge.net/projects/plantuml/files/plantuml.jar/download -O plantuml.jar

      - name: Generate Diagrams
        run: |
          java -jar plantuml.jar diagrams/**/*.puml

      - name: Commit Diagrams
        run: |
          echo $(git branch)
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git config pull.rebase true   # rebase
          git add diagrams/**/*.png
          git commit -m "Automated diagram generation" || exit 0

      - name: Pull latest changes
        run: git pull origin ${{ github.head_ref || github.ref_name }}

      - name: Push Diagrams
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref || github.ref_name }}
          if: success()

  generate-asyncApi:
    runs-on: node-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: install asyncapi
        run: npm install -g @asyncapi/cli

      - name: generate asyncApi
      - run:  asyncapi generate fromTemplate asyncapi.yaml @asyncapi/html-template@3.0.0 -o kafka --use-new-generator